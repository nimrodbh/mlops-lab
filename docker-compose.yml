services:
  mlflow:
    build: ./mlflow-server
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow/data"]
    mem_limit: 1536m # same limit as the Kubernetes manifest, so memory problems show up here too
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    environment:
      MLFLOW_URL: http://mlflow:5000
      PORT: "3001"
    ports: ["3001:3001"]
    depends_on:
      mlflow: { condition: service_healthy }

  dashboard:
    build: ./dashboard
    ports: ["8080:80"]
    depends_on: [gateway]

  # One-off job: `docker compose --profile train run --rm trainer`
  trainer:
    build: ./trainer
    profiles: ["train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow: { condition: service_healthy }

volumes:
  mlflow-data:
