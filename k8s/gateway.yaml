apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: mlops-lab/gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: MLFLOW_URL, value: "http://mlflow:5000" }
            - { name: PORT, value: "3001" }
            - { name: GATE_MIN_ACCURACY, value: "0.9" }
            - { name: GATE_MIN_IMPROVEMENT, value: "0.001" }
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3001 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - port: 3001
      targetPort: 3001
