# Not part of the base kustomization: a training sweep is run on demand.
#   kubectl -n mlops-lab create -f k8s/trainer-job.yaml
# generateName gives every sweep its own Job, so each one registers a new model version.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: trainer-
  namespace: mlops-lab
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-lab/trainer:dev
          imagePullPolicy: IfNotPresent
          args: ["--runs", "8"]
          env:
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
