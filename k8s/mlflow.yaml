apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on a ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: mlops-lab/mlflow:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi } # idle about 550Mi, about 920Mi right after a training sweep uploads its models
          volumeMounts:
            - name: data
              mountPath: /mlflow/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector: { app: mlflow }
  ports:
    - port: 5000
      targetPort: 5000
